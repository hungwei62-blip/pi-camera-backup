    <h1>Pi Camera Backup</h1>
    <p>Pi Camera Backup 是個人使用的 Raspberry Pi 相機備份工具。它將使用者拍攝的照片、影片與焦點堆疊檔案備份到使用者自己的 Google 雲端硬碟。</p>
    <p>應用程式只要求 <code>drive.file</code> 權限，僅管理由這個應用程式建立或使用的雲端檔案。備份在 Raspberry Pi 上執行；此網站不接收照片或影片。</p>
    <p><a href="privacy.html">隱私權政策</a></p>
  </main>
</body>
